# The servers the fly.io machine runs (Dockerfile, fly.toml): one TCP service in fly.toml per [[server]] here,
# same port. Settings as in servers.example.toml; python3 serve.py --help says what each does.

host = "0.0.0.0"
proxy-protocol = true           # fly.io's proxy_proto handler names each player: required behind its proxy

# List every server in the FujiNet game lobby. Try the QA lobby first; leave the section commented out to stay
# unlisted. `address` is the name players' Ataris, Apples and PCs dial: <app>.fly.dev, or your own domain pointing at the
# app. [lobby.clients]: the disk each platform's lobby boots, all served by this machine (tnfsd, Dockerfile).
[lobby]
address = "syn-ack-wire.fly.dev"
key = 11
region = "us"
url = "https://lobby.fujinet.online"                  # the public lobby

[lobby.clients]
atari = "TNFS://syn-ack-wire.fly.dev/syn-ack-wire-atari.atr"
apple2 = "TNFS://syn-ack-wire.fly.dev/syn-ack-wire-apple2.po"
msdos = "TNFS://syn-ack-wire.fly.dev/syn-ack-wire-msdos.img"
coco = "TNFS://syn-ack-wire.fly.dev/synack.dsk"              # RUNM"SYNACK": the lobby runs the disk's name
nes = "TNFS://syn-ack-wire.fly.dev/syn-ack-wire-nes.nes"
adam = "TNFS://syn-ack-wire.fly.dev/syn-ack-wire-adam.ddp"
intv = "TNFS://syn-ack-wire.fly.dev/syn-ack-wire-intv.rom"

# The short links in the game disks' QR codes (fly.toml's https service): https://syn-ack-wire.fly.dev/ATARI
# redirects to the Atari manual, any platform the same way by its docs/manual/ folder; / to the project.
[web]
port = 8080
manual = "https://raw.githubusercontent.com/michaelsternberg/syn-ack-wire/main/docs/manual/{platform}/syn-ack-wire-manual-{platform}.pdf"
home = "https://github.com/michaelsternberg/syn-ack-wire"

# Listed in the lobby by region name when equally busy (busier servers float up), so the names sort in the
# order wanted: relaxed, relaxed, quicker, fast. The default port, 6502, is relaxed: the kindest landing for a
# disk booted without the lobby.

[[server]]
port = 6502
region = "CHIBA-GRID-7"
description = "relaxed pace"
think-exploit = "15,5"          # 10 to 20 s before a bot runs an exploit
think-buy = "5,2"               # 3 to 7 s before it buys
abandon = 180                   # drop a game after 3 minutes with nobody connected
afk = 2                         # two timeouts in a row put a player on autopilot

[[server]]
port = 6503
region = "NEO-KANSAI-1"
description = "relaxed pace"
think-exploit = "15,5"
think-buy = "5,2"
abandon = 180
afk = 2

[[server]]
port = 6504
region = "OSAKA-SPRAWL"
description = "quicker pace"
think-exploit = "8,4"           # 4 to 12 s
think-buy = "5,2"               # 3 to 7 s
abandon = 180
afk = 2

[[server]]
port = 6505
region = "SEOUL-NODE-2"
description = "fast pace"
think-exploit = "3,1"           # 2 to 4 s
think-buy = "2,1"               # 1 to 3 s
abandon = 180
afk = 2
