# The servers the fly.io machine runs (Dockerfile, fly.toml): one TCP service in fly.toml per [[server]] here,
# same port. Settings as in servers.example.toml; python3 serve.py --help says what each does.

host = "0.0.0.0"
proxy-protocol = true           # fly.io's proxy_proto handler names each player: required behind its proxy

# List every server in the FujiNet game lobby. Try the QA lobby first; leave the section commented out to stay
# unlisted. `address` is the name players' Ataris dial: <app>.fly.dev, or your own domain pointing at the app.
# [lobby]
# address = "syn-ack-wire.fly.dev"
# client = "TNFS://tnfs.example.com/synack.atr"
# key = 11
# region = "us"
# url = "https://qalobby.fujinet.online"

# Listed in the lobby by region name when equally busy (busier servers float up), so the names sort in the
# order wanted: relaxed, relaxed, quicker, fast. The default port, 6502, is relaxed: the kindest landing for a
# disk booted without the lobby.

[[server]]
port = 6502
region = "CHIBA-GRID-7"
description = "relaxed pace"
think-exploit = "20,10"         # 10 to 30 s before a bot runs an exploit
think-buy = "12,5"              # 7 to 17 s before it buys
timeout = 90                    # and a longer shot clock for the people

[[server]]
port = 6503
region = "NEO-KANSAI-1"
description = "relaxed pace"
think-exploit = "20,10"
think-buy = "12,5"
timeout = 90

[[server]]
port = 6504
region = "OSAKA-SPRAWL"
description = "quicker pace"
think-exploit = "8,4"           # 4 to 12 s
think-buy = "5,2"               # 3 to 7 s

[[server]]
port = 6505
region = "SEOUL-NODE-2"
description = "fast pace"
think-exploit = "3,1"           # 2 to 4 s
think-buy = "2,1"               # 1 to 3 s
