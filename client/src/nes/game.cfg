# game.cfg -- the NES client: NROM-256 (mapper 0), 32K PRG, 8K CHR-RAM, and
# the FujiNet NES cartridge's 8K WRAM at $6000. From fujinet-lib's
# nes-fujinet.cfg (cc65's nes.cfg with the FujiNet claim carved out), with our
# own start-up (crt0.s) and no CHR-ROM: the tiles are made at start-up (ppu.s).
#
# The cartridge keeps its mailbox alive after booting an image only if "FUJI"
# sits at $FFF0, just below the vectors: CLAIM keeps that space, and
# nes-romstamp.py writes it after the link. Code must stay in STARTUP, LOWCODE,
# ONCE or CODE, the segments romstamp scans for read-modify-writes of the
# mailbox's write-only pages.
#
# RAM: zero page (cc65's runtime from $02, then ours); $0100 the CPU stack;
# $0200 the sprites (OAM, DMA'd every frame); $0300 rx_ring (page-aligned, so
# its 8-bit indexes wrap for free); $0400 what the NMI shares with the program
# (LORAM: dirty marks, the row queue, the pad's events); $0500-$07FF the C
# stack. Everything else is in the WRAM, the screens' cells first (CELLS, page-aligned: ppu.s).
SYMBOLS {
    __STACKSIZE__: type = weak, value = $0300;
}
MEMORY {
    ZP:     file = "", start = $0002, size = $00FE, type = rw, define = yes;
    HEADER: file = %O, start = $0000, size = $0010, fill = yes;
    ROM:    file = %O, start = $8000, size = $7FF0, fill = yes, fillval = $FF, define = yes;
    CLAIM:  file = %O, start = $FFF0, size = $000A, fill = yes, fillval = $FF;
    VECS:   file = %O, start = $FFFA, size = $0006, fill = yes;
    OAMRAM: file = "", start = $0200, size = $0100;
    RINGRAM: file = "", start = $0300, size = $0100;
    LORAM:  file = "", start = $0400, size = $0100;
    SRAM:   file = "", start = $0500, size = __STACKSIZE__, define = yes;
    CELLRAM: file = "", start = $6000, size = $0780;
    WRAM:   file = "", start = $6780, size = $1880, define = yes;
}
SEGMENTS {
    ZEROPAGE: load = ZP,              type = zp;
    HEADER:   load = HEADER,          type = ro;
    STARTUP:  load = ROM,             type = ro,  define   = yes;
    LOWCODE:  load = ROM,             type = ro,  optional = yes;
    ONCE:     load = ROM,             type = ro,  optional = yes;
    CODE:     load = ROM,             type = ro,  define   = yes;
    RODATA:   load = ROM,             type = ro,  define   = yes;
    DATA:     load = ROM, run = WRAM, type = rw,  define   = yes;
    CLAIM:    load = CLAIM,           type = ro;
    VECTORS:  load = VECS,            type = ro;
    OAM:      load = OAMRAM,          type = bss, define   = yes;
    RING:     load = RINGRAM,         type = bss, define   = yes;
    LORAM:    load = LORAM,           type = bss, define   = yes;
    CELLS:    load = CELLRAM,         type = bss, define   = yes;
    BSS:      load = WRAM,            type = bss, define   = yes;
}
FEATURES {
    CONDES: type    = constructor,
            label   = __CONSTRUCTOR_TABLE__,
            count   = __CONSTRUCTOR_COUNT__,
            segment = ONCE;
    CONDES: type    = destructor,
            label   = __DESTRUCTOR_TABLE__,
            count   = __DESTRUCTOR_COUNT__,
            segment = RODATA;
    CONDES: type    = interruptor,
            label   = __INTERRUPTOR_TABLE__,
            count   = __INTERRUPTOR_COUNT__,
            segment = RODATA,
            import  = __CALLIRQ__;
}
