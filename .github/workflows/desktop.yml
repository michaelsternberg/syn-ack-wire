# The desktop client for Windows, macOS and Linux (desktop/README.md). Run by hand for test builds (Actions, Run
# workflow: the files are the run's artifacts), or push a tag desktop-vX.Y.Z to attach them to a GitHub release.
name: desktop

on:
  workflow_dispatch:
  push:
    tags: ["desktop-v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            name: windows
            cmake: -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          - os: macos-14
            name: macos
            cmake: -DCMAKE_OSX_ARCHITECTURES=arm64;x86_64 -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          - os: ubuntu-22.04          # an older glibc, so the program runs on more Linux systems
            name: linux
            cmake: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5   # 3.11 or newer for tomllib (the generated headers)
        with:
          python-version: "3.12"
      - name: Linux libraries for SDL3
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxss-dev libxfixes-dev libxkbcommon-dev libwayland-dev wayland-protocols libegl1-mesa-dev \
            libgl1-mesa-dev libasound2-dev libpulse-dev libpipewire-0.3-dev libdbus-1-dev libudev-dev
      - name: Configure
        shell: bash
        run: cmake -S desktop -B build -DCMAKE_BUILD_TYPE=Release -DSAW_FETCH_DEPS=ON "${{ matrix.cmake }}"
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package
        shell: bash
        run: |
          cmake --install build --config Release --prefix dist/syn-ack-wire
          cd dist
          case "${{ matrix.name }}" in
            windows) 7z a ../syn-ack-wire-windows.zip syn-ack-wire ;;
            macos)   ditto -c -k --keepParent syn-ack-wire ../syn-ack-wire-macos.zip ;;
            linux)   tar czf ../syn-ack-wire-linux.tar.gz syn-ack-wire ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: syn-ack-wire-${{ matrix.name }}
          path: syn-ack-wire-${{ matrix.name }}.*

  release:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: SYN-ACK WIRE desktop ${{ github.ref_name }}
          files: syn-ack-wire-*
