# The short links in the disks' QR codes (servers.fly.toml [web]): fly.io terminates TLS for <app>.fly.dev and
# passes plain HTTP; the server answers with redirects to the manuals (https). Port 80 stays plain http, without
# force_https: the desktop client's Region menu reads /SEATS there, and it has no TLS.
[[services]]
  internal_port = 8080
  protocol = "tcp"
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1
  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]
  [[services.ports]]
    port = 80
    handlers = ["http"]

# The client disk for the FujiNet lobby to boot: tnfsd (deploy/start.sh), TNFS on UDP, which reaches the machine
# with the player's own address over the dedicated IPv4. No TCP: through the proxy every player would share one
# address, and tnfsd allows 16 sessions per address. FujiNet tries TCP first, then falls back to UDP.
[[services]]
  internal_port = 16384
  protocol = "udp"
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1
  [[services.ports]]
    port = 16384
