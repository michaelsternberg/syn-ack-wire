# SYN-ACK WIRE -- canonical names, vocabulary and rule numbers.
#
# This is the ONE place to rename things. Generated from it:
#   docs/rulebook/theme.tex      (make -C docs/rulebook)
#   later: server code reads this file directly; client headers/includes are generated.
#
# Terms: `s` = singular, `p` = plural (defaults to s + "s"). Capitalized forms are generated.
# Keys must be letters only (they become LaTeX macro names).

[game]
title       = "SYN-ACK WIRE"
name        = "Syn-Ack Wire"          # mixed case, as other games show in the FujiNet lobby
endshout    = "UNJACK!"
region      = "NEO-KANSAI-1"          # default grid region; serve.py --region overrides it (<= 12 chars)
currency    = "¥"

[rules]
startcash   = 6000    # in currency units
kitsize     = 6       # exploits in hand
maxbuy      = 3       # coins bought per turn
coinsupply  = 25      # coins per syndicate
safesize    = 11      # Black ICE at this many nodes
endsize     = 41      # Total Compromise at this many nodes
rows        = 9       # labelled 0..8
cols        = 12      # labelled A..L
minplayers  = 2
maxplayers  = 6

# Board glyphs. Syndicate glyphs are their `letter` below.
[glyphs]
empty  = "."
spike  = "+"
target = "*"      # PC test client: an empty node one of your exploits can run on (the Atari shows the exploit's 1-6)

[terms]
playertitle     = { s = "Netrunner", p = "Netrunners" }
player          = { s = "netrunner" }
grid            = { s = "grid" }
node            = { s = "node" }
exploit         = { s = "exploit", p = "exploits" }
kit             = { s = "exploit kit" }
spike           = { s = "spike" }
spiking         = { s = "spiking" }
hive            = { s = "hive" }
hivejack        = { s = "hivejack" }
infiltration    = { s = "infiltration" }
broker          = { s = "broker" }
finderscut      = { s = "finder's cut" }
spread          = { s = "spread" }
safe            = { s = "Black ICE", p = "Black ICE" }
patched         = { s = "patched out", p = "patched out" }
jackin	        = { s = "jack-in", p = "jack-in" }
jackedin	= { s = "jacked-in", p = "jacked-in" }
burnkit         = { s = "burn the kit", p = "burn the kit" }
logoff          = { s = "log off", p = "log off" }     # leave the game for good: the client's Esc, Y/N
coin            = { s = "crypto", p = "crypto" }
money           = { s = "new yen", p = "new yen" }
account         = { s = "acct" }            # Atari: the netrunner table's money column (<= 7 chars)
root            = { s = "ROOT", p = "ROOT" }
sudo            = { s = "SUDO", p = "SUDO" }
cashout         = { s = "cash out", p = "cash out" }
swap            = { s = "swap" }
hodl            = { s = "HODL", p = "HODL" }
flatlined       = { s = "flatlined", p = "flatlined" }
revived         = { s = "back from the flatline", p = "back from the flatline" }
bank            = { s = "Darkpool" }
nullroute       = { s = "null-route" }
totalcompromise = { s = "Total Compromise", p = "Total Compromise" }
lockdown        = { s = "Lockdown", p = "Lockdown" }
stall           = { s = "Grid Stall", p = "Grid Stall" }
absorber        = { s = "absorber" }
absorbed        = { s = "absorbed", p = "absorbed" }

# Handles given to bot seats (<= 8 chars, ASCII uppercase/digits/punctuation).
[bots]
names = ["NULLPTR", "WIREWOLF", "R00TKIT", "SEGFAULT", "H0NEYP0T", "GL1TCH", "K1LLSWCH", "BYTEME"]

# Log lines sent to clients (keep <= 38 chars after substitution; ASCII + currency symbol only).
# Placeholders: {player} handle, {node} e.g. C4, {syn} syndicate short name, {coin} its coin ticker
# (coin lines name the syndicate, not the ticker, so players can tell who is who),
# {absorber}/{absorbed} short names, {size}, {amount} formatted money, {n} count,
# {region}, {shout}, {bot} a bot seat's handle.
[log]
spike      = "[+] {player} SPIKES {node}"
found      = "[*] INFILTRATION! {syn} HIVE UP"
finderscut = "[$] {player} FINDER'S CUT 1 {syn}"
spread     = "[*] {syn} HIVE SPREADS: {size} NODES"
safe       = "[#] {syn} HIVE WRAPPED IN BLACK ICE"
hivejack   = "[!] HIVEJACK: {absorber} SEIZES {absorbed}"
root       = "[$] ROOT {player} +{amount}"
sudo       = "[$] SUDO {player} +{amount}"
cashout    = "[$] {player} CASHES OUT {n} {syn}"
swap       = "[$] {player} SWAPS {n} {syn}"
hodl       = "[*] {player} HODLS {n} {syn}"
flatlined  = "[-] {syn} CRYPTO FLATLINED"
buy        = "[$] {player} BUYS {n} {syn}"
nobuy      = "[-] {player} HAS NOTHING TO BUY"
burnkit    = "[-] {player} BURNS THE KIT"
noplay     = "[-] {player} HAS NO EXPLOIT TO RUN"
patched    = "[-] EXPLOIT {node} PATCHED OUT"
callend    = "[!] {player} CALLS THE NULL-ROUTE"
nullroute  = "[!] NULL-ROUTE {region}: {shout}"
quarantine = "[!] GRID STALLED: {region} SEALED"
final      = "[$] {player} FINAL {amount}"
winner     = "[!] TOP NETRUNNER: {player}"
abandoned  = "[!] GAME DROPPED: NOBODY PLAYING"
hostclock  = "[*] {player} HAS {n} S TO START"
newhost    = "[*] {player} IS THE HOST NOW"           # to everyone in the lobby when the host role passes
door       = "[*] {n} AT THE DOOR"                  # to the host: how many are at the title screen
autopilot  = "[?] {player} ON AUTOPILOT"
returned   = "[*] {player} JACKS BACK IN"
jackin     = "[+] {player} JACKS IN FOR {bot}"
takeover   = "[*] GAME IN PROGRESS: TAKING OVER BOT"   # to the one jacking in, just before `jackin`
logoff     = "[-] {bot} TAKES OVER FROM {player}"   # a player left the game for good (Esc, Y)

# The title screen's line under the server, before the player joins (<= 28 chars).
# Placeholders: {n} players waiting in the lobby.
[status]
lobby  = "LOBBY OPEN: {n} WAITING"
jackin = "IN PROGRESS: TAKE OVER A BOT"
away   = "FULL: DROPPED PLAYERS REJOIN"    # by token or handle
full   = "TABLE FULL"

# Why a move was rejected. Sent only to the player who made it, as a log line (<= 38 chars).
# Placeholders: {node}, {syn} syndicate short name, {n}, {lo}/{hi} seat range.
[errors]
nodecision  = "[-] NO DECISION IS WAITING"
notyours    = "[-] NOT YOUR DECISION"
late        = "[-] TOO LATE: YOUR BOT ANSWERED"
notinkit    = "[-] {node} IS NOT IN YOUR KIT"
cantrun     = "[-] {node} CAN'T BE RUN NOW"
hasahive    = "[-] {syn} ALREADY HAS A HIVE"
notoffered  = "[-] PICK ONE OF THE OFFERED HIVES"
oddswap     = "[-] SWAP AN EVEN AMOUNT OF CRYPTO"
toomany     = "[-] YOU ONLY HOLD {n} CRYPTO"
swapsupply  = "[-] DARKPOOL HAS ONLY {n} {syn} LEFT"
maxbuy      = "[-] MAX {n} CRYPTO PER TURN"
nohive      = "[-] THAT SYNDICATE HAS NO HIVE"
soldout     = "[-] DARKPOOL IS OUT OF {syn}"
nocash      = "[-] NOT ENOUGH YEN"
cantend     = "[-] NULL-ROUTE CAN'T BE CALLED YET"
seats       = "[-] START WITH {lo}-{hi} SEATS"

